name: Backend

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Migration, store and market-endpoint tests run against this real TimescaleDB.
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --python 3.12

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # Includes test_compose_isolation.py: the network rules in
      # docker-compose.yml are assertions, so weakening them fails here.
      - name: Test
        run: uv run pytest -q

  stack:
    name: Build images, start stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck setup.sh
        run: shellcheck setup.sh

      # Creates .env with generated secrets, validates, builds, starts, and
      # waits for every healthcheck. Paper broker, trading disabled.
      - name: Run setup.sh
        run: ./setup.sh

      - name: Terminal and gateway answer through nginx
        run: |
          curl --fail --silent --show-error -o /dev/null http://127.0.0.1:8080/
          curl --fail --silent --show-error http://127.0.0.1:8080/api/healthz | grep -q '"service":"api"'

      - name: Orders need a token and are refused while trading is disabled
        run: |
          body='{"client_order_id":"ci-order-0001","symbol":"BTC","side":"buy","quantity":0.001,"order_type":"market","reference_price":50000}'
          url=http://127.0.0.1:8080/api/v1/orders
          token="$(grep '^API_AUTH_TOKEN=' .env | cut -d= -f2)"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d "$body" "$url")" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -H "Authorization: Bearer $token" -d "$body" "$url")" = 422

      - name: Execution has no direct route out; the proxy refuses other hosts
        run: |
          probe() { docker compose exec -T "$1" python -c "$2"; }
          probe execution "import socket,sys
          try: socket.create_connection(('1.1.1.1', 443), 3)
          except OSError: sys.exit(0)
          sys.exit('execution reached the internet directly')"
          probe execution "import httpx,sys
          try: httpx.get('https://example.com', timeout=8)
          except httpx.ProxyError: sys.exit(0)
          sys.exit('proxy let a non-allowlisted host through')"
          probe agents "import socket,sys
          try: socket.create_connection(('execution', 8000), 3)
          except OSError: sys.exit(0)
          sys.exit('agents reached execution')"

      # Depends on Hyperliquid testnet being up, so it reports but does not fail the run.
      - name: The proxy lets the allowlisted broker host through
        continue-on-error: true
        run: |
          docker compose exec -T execution python -c "import httpx
          httpx.post('https://api.hyperliquid-testnet.xyz/info', json={'type': 'meta'}, timeout=15).raise_for_status()"

      - name: Migrations ran and the market endpoints answer
        run: |
          token="$(grep '^API_AUTH_TOKEN=' .env | cut -d= -f2)"
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = 0
          for p in symbols 'candles?coin=BTC&interval=1m' 'quotes?coins=BTC'; do
            curl --fail --silent --show-error -H "Authorization: Bearer $token" "http://127.0.0.1:8080/api/v1/market/$p"
            echo
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/market/symbols)" = 401

      # Needs Hyperliquid testnet, so it reports but does not fail the run.
      - name: Ingestion stores a BTC candle from testnet
        continue-on-error: true
        run: |
          token="$(grep '^API_AUTH_TOKEN=' .env | cut -d= -f2)"
          for _ in $(seq 1 24); do
            n="$(curl -s -H "Authorization: Bearer $token" 'http://127.0.0.1:8080/api/v1/market/candles?coin=BTC&interval=1m&limit=5' | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
            if [ "${n:-0}" -gt 0 ]; then echo "BTC candles: $n"; exit 0; fi
            sleep 5
          done
          echo "no BTC candle after 2 minutes" >&2
          docker compose logs ingestion --no-color --tail 50
          exit 1

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
