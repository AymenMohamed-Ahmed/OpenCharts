[project]
name = "openbroker-backend"
version = "0.1.0"
description = "FastAPI backend for the OpenCharts terminal: gateway and risk gate, AI agents, market-data ingestion, broker execution."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "hyperliquid-python-sdk>=0.24,<0.25",
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "eth-account>=0.13.7",
    "fakeredis>=2.26",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S104"]  # services bind 0.0.0.0 inside their container; exposure is set by compose

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
