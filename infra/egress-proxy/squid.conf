# Forward proxy for the execution service: its only route to the internet.
# HTTPS tunnels (CONNECT :443) to the hosts in allowlist.txt, nothing else.

http_port 3128

acl broker_hosts dstdomain "/etc/squid/allowlist.txt"
acl tls_port port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny !tls_port
http_access allow broker_hosts
http_access deny all

cache deny all
pinger_enable off
via off
forwarded_for delete
shutdown_lifetime 2 seconds
